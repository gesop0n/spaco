name: Roll back backend

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Existing Cloud Run revision name (for example, spaco-api-abc1234-12-1)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REGION: ${{ vars.REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_SERVICE_URL: ${{ vars.CLOUD_RUN_SERVICE_URL }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate revision
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "${REVISION}" =~ ^spaco-api-[a-z0-9-]+$ ]]; then
            echo "Revision must belong to spaco-api" >&2
            exit 1
          fi
          gcloud run revisions describe "${REVISION}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(metadata.name)'

      - name: Shift all traffic to revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --to-revisions "${REVISION}=100" \
            --quiet

      - name: Remove candidate tag
        run: |
          gcloud run services update-traffic "${CLOUD_RUN_SERVICE}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --remove-tags candidate \
            --quiet

      - name: Verify production
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 "${CLOUD_RUN_SERVICE_URL}/health"
