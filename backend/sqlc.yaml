version: "2"

sql:
  - engine: postgresql
    schema: migrations
    queries: internal/modules/account/internal/adapter/postgres/queries
    gen:
      go:
        package: accountsqlc
        out: internal/modules/account/internal/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID

  - engine: postgresql
    schema: migrations
    queries: internal/modules/catalog/internal/adapter/postgres/queries
    gen:
      go:
        package: catalogsqlc
        out: internal/modules/catalog/internal/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time

  - engine: postgresql
    schema: migrations
    queries: internal/modules/review/internal/adapter/postgres/queries
    gen:
      go:
        package: reviewsqlc
        out: internal/modules/review/internal/adapter/postgres/sqlc
        sql_package: pgx/v5
        emit_interface: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
